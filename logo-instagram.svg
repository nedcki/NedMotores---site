<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- background -->
  <rect width="512" height="512" fill="#080c14"/>

  <!-- shield full centered, large -->
  <!-- upper amber section -->
  <path d="M136,60 H376 V280 Q376,420 256,470 Q136,420 136,280 Z" fill="#f59e0b"/>
  <!-- lower dark section -->
  <path d="M136,220 H376 V280 Q376,420 256,470 Q136,420 136,220 Z" fill="#111827"/>
  <!-- divider -->
  <rect x="136" y="216" width="240" height="8" fill="#d97706"/>
  <!-- NED upper -->
  <text x="256" y="152" font-family="Arial Black,Impact,sans-serif" font-size="72" font-weight="900" fill="#111827" text-anchor="middle" dominant-baseline="middle" letter-spacing="6">NED</text>
  <!-- amber banner -->
  <rect x="176" y="298" width="160" height="8" rx="4" fill="#f59e0b"/>
  <!-- AUTO lower -->
  <text x="256" y="360" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#f59e0b" text-anchor="middle" dominant-baseline="middle" letter-spacing="8">AUTO</text>

  <!-- wordmark below shield -->
  <text x="256" y="500" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#7d8fa3" text-anchor="middle" dominant-baseline="middle" letter-spacing="3">AUTOGESTÃO</text>
</svg>
